name: Docker

on:
  pull_request:
    paths:
      - .dockerignore
      - docker/**
      - rl_insight/**
      - pyproject.toml
      - tests/monitor/special_e2e/**
      - .github/workflows/docker.yml
  push:
    tags:
      - "v*" # Release tags must be semver, e.g. v0.3.0.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -f docker/Dockerfile -t rl-insight:smoke .

      - name: Verify startup, shutdown, and restart
        run: tests/monitor/special_e2e/docker_smoke_test.sh rl-insight:smoke

  # Publish on version tags only, gated by the smoke test.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write # Push to ghcr.io with GITHUB_TOKEN.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v0.3.0 -> 0.3.0, 0.3, latest ("latest" is skipped for pre-releases).
      - name: Extract image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
